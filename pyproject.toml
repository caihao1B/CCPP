[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccpp-mowing-planner"
version = "2.1.0"
description = "Coverage planning with constrained analytical curves, differential/forward-only models and independent validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.11,<2", "shapely>=2.0,<3", "networkx>=3.2,<4", "matplotlib>=3.8,<4", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
ccpp-mow = "ccpp_mowing.cli:main"

[tool.setuptools.packages.find]
include = ["ccpp_mowing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
